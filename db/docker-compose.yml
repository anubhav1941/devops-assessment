services:
  postgres:
    image: postgres:16
    container_name: hotel_bookings_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: appadmin
      POSTGRES_PASSWORD: apppassword
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./migrations:/migrations:ro
      - ./seed:/seed:ro
      - ./docker-entrypoint-initdb.d/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appadmin -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
